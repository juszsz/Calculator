<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="displayCon">
            <h2 class="displayTxt">1</h2>
            <h2 class="displayTxt">+</h2>
            <h2 class="displayTxt">2</h2>
            <h2 class="displayTxt">=</h2>
            <h2 class="displayTxt">3</h2>
        </div>
        <div class="btnCon">
            <div class="rows">
                <button class="calBtn">Clear</button>
                <button class="calBtn">Backspace</button>
            </div>
            <div class="rows">
                <button class="calBtn">7</button>
                <button class="calBtn">8</button>
                <button class="calBtn">9</button>
                <button class="calBtn">/</button>
            </div>
            <div class="rows">
                <button class="calBtn">4</button>
                <button class="calBtn">5</button>
                <button class="calBtn">6</button>
                <button class="calBtn">x</button>
            </div>
            <div class="rows">
                <button class="calBtn">1</button>
                <button class="calBtn">2</button>
                <button class="calBtn">3</button>
                <button class="calBtn">-</button>
            </div>
            <div class="rows">
                <button class="calBtn">0</button>
                <button class="calBtn">.</button>
                <button class="calBtn">=</button>
                <button class="calBtn">+</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
