<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="displayCon">
            <h2 class="displayTxt" id="numOne">1</h2>
            <h2 class="displayTxt" id="operatorType">+</h2>
            <h2 class="displayTxt" id="numTwo">2</h2>
            <h2 class="displayTxt" id="equalSign">=</h2>
            <h2 class="displayTxt" id="answer">3</h2>
        </div>
        <div class="btnCon">
            <div class="rows" id="rowOne">
                <button class="calBtn" id="clearBtn">Clear</button>
                <button class="calBtn" id="backSpaceBtn">Backspace</button>
            </div>
            <div class="rows">
                <button class="calBtn" id="btn7">7</button>
                <button class="calBtn" id="btn8">8</button>
                <button class="calBtn" id="btn9">9</button>
                <button class="calBtn" id="division">/</button>
            </div>
            <div class="rows">
                <button class="calBtn" id="btn4">4</button>
                <button class="calBtn" id="btn5">5</button>
                <button class="calBtn" id="btn6">6</button>
                <button class="calBtn" id="multiply">x</button>
            </div>
            <div class="rows">
                <button class="calBtn" id="btn1">1</button>
                <button class="calBtn" id="btn2">2</button>
                <button class="calBtn" id="btn3">3</button>
                <button class="calBtn" id="subtract">-</button>
            </div>
            <div class="rows">
                <button class="calBtn" id="btn0">0</button>
                <button class="calBtn" id="btnDot">.</button>
                <button class="calBtn" id="equals">=</button>
                <button class="calBtn" id="addition">+</button>
            </div>
        </div>
    </div>

    <script src="index.js"></script>
</body>
</html>
